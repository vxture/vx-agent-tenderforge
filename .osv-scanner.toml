# osv-scanner 的抑制配置（CI 的 `audit` 作业，.github/workflows/ci.yml）。
#
# 空忽略基线。本产品有三个生态：npm（前端）、Maven（后端）、PyPI（AI 服务），
# 三个都必须真的被扫到——只扫一个而报告全绿，是这条闸门最可能的失效方式，
# 因为它看起来一直在工作。ci.yml 里有一段显式核对三个 lockfile 都出现在
# 扫描输出里。
#
# 每一条 osv-scanner 报出来的告警都应当被修复（提直接依赖的下限、
# 加 override、或精确钉版本），而不是在这里抑制掉。
#
# 确实修不了的残留（只在构建期用到、进不了交付镜像的传递依赖；
# 或者强升会坏掉的上游钉版），加<b>一条</b> [[PackageOverrides]] 指明
# 那个确切的包与版本，并写清楚理由。作用域刻意是「包+版本」而不是
# 按 GHSA id 全局忽略——那样的话，同一个 CVE 在另一个版本上重新出现时
# 仍然会被报出来。永远不要放宽这道闸门（不加 continue-on-error，
# 不把它从必需检查里摘掉）。
#
# 示例（注释掉——本仓目前没有已接受的残留）：
# [[PackageOverrides]]
# name = "some-pkg"
# version = "1.2.3"
# ecosystem = "npm"
# ignore = true
# reason = "仅构建期使用的传递依赖，不进交付镜像；上游钉死了版本"

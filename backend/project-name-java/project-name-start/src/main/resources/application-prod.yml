spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:30}
  # 生产上应用连的是最小权限角色 tenderforge_svc，它没有 DDL 权限。
  # 就算有人把 Flyway 依赖加回来并打开它，建表也会被库直接拒绝——
  # 配置可以被改错，权限不会。

app:
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
  storage:
    root: ${PRIVATE_STORAGE_ROOT:/data/czghagent/private}

logging:
  level:
    root: INFO
    com.td.czghagent: INFO

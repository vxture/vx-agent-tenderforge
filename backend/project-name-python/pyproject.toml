# GENERATED_BY_AI
# MODEL: gpt-5
# DATE: 2026-07-29
[project]
name = "tenderagent-parser"
version = "1.0.0"
description = "TenderAgent 招标文件文本解析服务"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["czghagent_ai"]
# 分支覆盖单独统计：只看行覆盖会把「每个 if 都只走了一边」报成 100%，
# 而错误处理路径恰恰全在没走的那一边。
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]


# DATE: 2026-07-29
server {
    listen 80;
    server_name _;
    client_max_body_size 55m;
    root /usr/share/nginx/html;
    index index.html;

    # 平台 C3 下发的回调 /api/webhooks/vxture 就落在这一条里，**没有单独的 location**。
    # 通则把回调路径定在 /api/ 下不是巧合：它让回调与其余机器接口同走一条转发规则，
    # 于是这里不需要第二处写死地址，也就不会有第二处可以漂移。
    #
    # 真正要盯的是反过来的那一面：任何**不**匹配 /api/ 的回调路径会落到文件末尾的
    # `location /` 被 try_files 交给 SPA，于是平台 POST 过来拿到 **index.html 和
    # HTTP 200**——投递被判为成功，产品却什么都没收到，开通与档位变更静默丢失，
    # 两侧都没有任何报错。所以路径取值由 scripts/guardrails/check_webhook_path.py 守着。
    #
    # 不加 proxy_set_header 之外的任何处理：HMAC 验签是对**原始字节**做的，
    # 任何改写 body 的中间步骤都会让验签失败，而失败信息只会说「签名不对」。

    location /api/ {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /v3/api-docs {
        proxy_pass http://api:8081;
    }

    location /swagger-ui {
        proxy_pass http://api:8081;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name _;
    client_max_body_size 55m;
    root /usr/share/nginx/html;
    index index.html;

    # 平台 C3 下发的回调 /api/webhooks/vxture 就落在这一条里，**没有单独的 location**。
    # 通则把回调路径定在 /api/ 下不是巧合：它让回调与其余机器接口同走一条转发规则，
    # 于是这里不需要第二处写死地址，也就不会有第二处可以漂移。
    #
    # 真正要盯的是反过来的那一面：任何**不**匹配 /api/ 的回调路径会落到文件末尾的
    # `location /` 被 try_files 交给 SPA，于是平台 POST 过来拿到 **index.html 和
    # HTTP 200**——投递被判为成功，产品却什么都没收到，开通与档位变更静默丢失，
    # 两侧都没有任何报错。所以路径取值由 scripts/guardrails/check_webhook_path.py 守着。
    #
    # 不加 proxy_set_header 之外的任何处理：HMAC 验签是对**原始字节**做的，
    # 任何改写 body 的中间步骤都会让验签失败，而失败信息只会说「签名不对」。

    # ── 迁移期入口：旧回调路径的别名（X-4 第 ① 步）───────────────────────────
    # 平台侧当前登记的仍是 https://tenderforge.vxture.com/provisioning/webhook。
    # **不能只上新路径就发版**——那等于跳过第 ① 步直接做第 ②：发版那一刻起，
    # 平台按旧地址投递会落到下面 `location /` 的 SPA catch-all，拿回 index.html
    # 和 HTTP 200，投递被判为送达而我们什么都没收到。两侧都不报错。
    #
    #   ① 新旧两路都能收，并发版   ← 本 location 的存在理由
    #   ② 平台侧把登记地址改成 /api/webhooks/vxture
    #   ③ 删掉本 location，只留标准路径
    #
    # **第 ③ 步不是可选的**：留着两条路，下一个人无法从代码判断线上登记的是哪一个。
    # 删除条件写在 scripts/guardrails/check_webhook_path.py 的 LEGACY_INBOUND_PATH
    # ——那个常量置 None 时，守卫会反过来要求本 location 必须消失。
    #
    # 精确匹配（`=`）而不是前缀：这个别名只有一个，前缀匹配会顺带把
    # /provisioning/webhook-anything 也转过去。
    # 转发目标是**标准路径**，所以两条路进的是同一个控制器、同一份验签与幂等逻辑。
    location = /provisioning/webhook {
        proxy_pass http://api:8081/api/webhooks/vxture;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /v3/api-docs {
        proxy_pass http://api:8081;
    }

    location /swagger-ui {
        proxy_pass http://api:8081;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

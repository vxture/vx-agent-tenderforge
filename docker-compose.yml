# GENERATED_BY_AI
# MODEL: gpt-5
# DATE: 2026-07-29
name: tenderforge

services:
  mysql:
    # 规范 §7 的容器命名 vx-<stack>-<engine>-db-<env>。<b>服务名仍用短名</b>，
    # 因为服务名才是网络别名、DATABASE_URL 只认它——改容器名永远不该断连接串。
    # （服务名从 mysql 改成 db 属于库层整改，owner 决定本轮不动。）
    container_name: vx-tenderforge-mysql-db-${DEPLOY_STAGE}
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: czghagent
      MYSQL_USER: czghagent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ChangeMe-Mysql-2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ChangeMe-Root-2026}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  ai:
    container_name: tenderforge-ai
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-vxture}/tenderforge-ai:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/project-name-python/Dockerfile
    restart: unless-stopped
    environment:
      AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN:-ChangeMe-Internal-Token-2026}
      # 模型出口。配上 ATLAS_API_URL 即切到 Atlas；不配则直连模型供应商，
      # 而那条路在部署阶段被拒绝启动（除非显式 ALLOW_MOCK_ON_DEPLOY）。
      DEPLOY_STAGE: ${DEPLOY_STAGE:?必须显式设置（local/dev/beta/production）——缺省成 local 会静默放行替身}
      ALLOW_MOCK_ON_DEPLOY: ${ALLOW_MOCK_ON_DEPLOY:-false}
      ATLAS_API_URL: ${ATLAS_API_URL:-}
      ATLAS_TIMEOUT_SECONDS: ${ATLAS_TIMEOUT_SECONDS:-90}
      # 专属 endpoint 授权到位之前保持 false——那时全部走 chat/default，
      # 链路能通但所有 operation 共用一套生成参数。
      ATLAS_USE_DEDICATED_ENDPOINTS: ${ATLAS_USE_DEDICATED_ENDPOINTS:-false}
      AI_MODEL_API_KEY: ${AI_MODEL_API_KEY:-}
      AI_MODEL_BASE_URL: ${AI_MODEL_BASE_URL:-https://api.deepseek.com}
      AI_MODEL_REQUEST_DIALECT: ${AI_MODEL_REQUEST_DIALECT:-deepseek}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-deepseek-v4-flash}
      AI_MODEL_FAST_NAME: ${AI_MODEL_FAST_NAME:-deepseek-v4-flash}
      AI_MODEL_QUALITY_NAME: ${AI_MODEL_QUALITY_NAME:-deepseek-v4-pro}
      AI_MODEL_TIMEOUT_SECONDS: ${AI_MODEL_TIMEOUT_SECONDS:-240}
      AI_MODEL_STAGE_TIMEOUT_SECONDS: ${AI_MODEL_STAGE_TIMEOUT_SECONDS:-540}
      AI_MODEL_MAX_RETRIES: ${AI_MODEL_MAX_RETRIES:-1}
      AI_MODEL_THINKING_BUDGET_TOKENS: ${AI_MODEL_THINKING_BUDGET_TOKENS:-4096}
      AI_MODEL_THINKING_DISABLED_OPERATIONS: ${AI_MODEL_THINKING_DISABLED_OPERATIONS:-project_overview_source_selection,project_overview_extraction,technical_scoring_extraction,outline_skeleton_planning,outline_branch_expansion,chapter_drafting}
      AI_MODEL_THINKING_ENABLED_OPERATIONS: ${AI_MODEL_THINKING_ENABLED_OPERATIONS:-bid_strategy_planning,branch_blueprint_planning,section_revision,consistency_review}
    # 容器探针**只探 liveness**（规范 025 §2 铁律 / 020 §4）。
    # 探就绪的表现是：一次数据库或上游抖动就把一个本来健康的容器判成
    # unhealthy 并重启——重启解决不了依赖不可用，只是让服务在依赖恢复期间
    # 也没了。就绪供发布闸门与编排用，不给探针用。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal-db-init:
    image: mysql:8.4
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ChangeMe-Root-2026}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:-ChangeMe-Temporal-2026}
    volumes:
      - ./deploy/mysql/init-temporal.sh:/init-temporal.sh:ro
    command: ["sh", "/init-temporal.sh"]
    restart: "no"

  temporal:
    image: temporalio/auto-setup:1.27.2
    restart: unless-stopped
    depends_on:
      temporal-db-init:
        condition: service_completed_successfully
    environment:
      DB: mysql8
      DB_PORT: 3306
      MYSQL_USER: temporal
      MYSQL_PWD: ${TEMPORAL_DB_PASSWORD:-ChangeMe-Temporal-2026}
      MYSQL_SEEDS: mysql
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

  temporal-ui:
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://127.0.0.1:8233
    ports:
      - "${TEMPORAL_UI_HOST:-127.0.0.1}:${TEMPORAL_UI_PORT:-8233}:8080"

  api:
    # 部署时由 deploy.sh 注入 IMAGE_* 指向 registry；本地不设这些变量时
    # 回落到 :local，配合下面的 build: 走本地构建。
    container_name: tenderforge-api
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-vxture}/tenderforge-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/project-name-java/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ai:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:mysql://mysql:3306/czghagent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DATABASE_USERNAME: czghagent
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-ChangeMe-Mysql-2026}
      DATABASE_DRIVER: com.mysql.cj.jdbc.Driver
      # 调优项。compose 的 environment: 是白名单——不在这里列出来，
      # 写进 .env 就完全没有反应，服务照常起来、照常用默认值、没有任何报错。
      # SERVER_PORT 刻意不放开：8081 在健康检查和 nginx 上游里是写死的，
      # 放开等于给人一个能把整栈弄坏的开关。
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE:-50MB}
      UPLOAD_MAX_REQUEST_SIZE: ${UPLOAD_MAX_REQUEST_SIZE:-55MB}
      PRIVATE_STORAGE_ROOT: /app/data/private
      AI_SERVICE_BASE_URL: http://ai:8000
      AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN:-ChangeMe-Internal-Token-2026}
      AI_SERVICE_TIMEOUT_SECONDS: ${AI_SERVICE_TIMEOUT_SECONDS:-600}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-DIRECT_DEEPSEEK}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-deepseek-v4-flash}
      AI_MODEL_FAST_NAME: ${AI_MODEL_FAST_NAME:-deepseek-v4-flash}
      AI_MODEL_QUALITY_NAME: ${AI_MODEL_QUALITY_NAME:-deepseek-v4-pro}
      BID_CHARACTERS_PER_PAGE: ${BID_CHARACTERS_PER_PAGE:-700}
      BID_GENERATION_MAX_CONCURRENCY: ${BID_GENERATION_MAX_CONCURRENCY:-3}
      TEMPORAL_ENABLED: ${TEMPORAL_ENABLED:-true}
      TEMPORAL_WORKER_ENABLED: "false"
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      DOCUMENT_SERVICE_ENABLED: ${DOCUMENT_SERVICE_ENABLED:-true}
      DOCUMENT_SERVICE_BASE_URL: ${DOCUMENT_SERVICE_BASE_URL:-http://ai:8000}
      DOCUMENT_SERVICE_TIMEOUT_SECONDS: ${DOCUMENT_SERVICE_TIMEOUT_SECONDS:-1800}
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED:-true}
      BOOTSTRAP_PLANNER_PASSWORD: ${BOOTSTRAP_PLANNER_PASSWORD:-ChangeMe-Planner-2026}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe-Admin-2026}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-12}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5274,http://localhost:5274}
      # ── 平台接入（产品接入通则）────────────────────────────────────────
      # 这些变量必须在这里显式列出：compose 的 environment 是白名单，
      # 宿主机 shell 或 .env 里有而这里没列的，容器根本看不到。
      # 漏列的表现不是报错——是「把凭证写进 .env 之后什么都没发生」。
      DEPLOY_STAGE: ${DEPLOY_STAGE:?必须显式设置（local/dev/beta/production）——缺省成 local 会静默放行替身}
      ALLOW_MOCK_ON_DEPLOY: ${ALLOW_MOCK_ON_DEPLOY:-false}
      # C1 身份 / C1b 换票：这一对 client 凭据同时是 S2S 凭据
      OIDC_RP_ENABLED: ${OIDC_RP_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      RP_SESSION_TTL: ${RP_SESSION_TTL:-43200}
      # 生产必须为 true：__Host- 前缀的 cookie 在 http 上会被浏览器直接拒收
      RP_SESSION_SECURE_COOKIE: ${RP_SESSION_SECURE_COOKIE:-false}
      # C2 权益 / C3 用量与开通
      PLATFORM_API_URL: ${PLATFORM_API_URL:-}
      PLATFORM_INTERNAL_AUTH_TOKEN: ${PLATFORM_INTERNAL_AUTH_TOKEN:-}
      TENDERFORGE_PROVISION_WEBHOOK_SECRET: ${TENDERFORGE_PROVISION_WEBHOOK_SECRET:-}
      TENDERFORGE_PROVISION_WEBHOOK_SECRET_NEXT: ${TENDERFORGE_PROVISION_WEBHOOK_SECRET_NEXT:-}
      CONSOLE_BASE_URL: ${CONSOLE_BASE_URL:-https://console.vxture.com}
      # Atlas 模型出口
      ATLAS_API_URL: ${ATLAS_API_URL:-}
      # 仅本地：驱动权益替身走遍各档位分支（部署态替身根本起不来）
      MOCK_TIER: ${MOCK_TIER:-}
      MOCK_STATUS: ${MOCK_STATUS:-}
      MOCK_BUNDLED: ${MOCK_BUNDLED:-false}
      MOCK_USAGE_GATED: ${MOCK_USAGE_GATED:-false}
      USAGE_FLUSH_INTERVAL_MS: ${USAGE_FLUSH_INTERVAL_MS:-15000}
      USAGE_FLUSH_BATCH_SIZE: ${USAGE_FLUSH_BATCH_SIZE:-100}
    volumes:
      - private-files:/app/data/private
    # 容器探针**只探 liveness**（规范 025 §2 铁律 / 020 §4）。
    # 探就绪的表现是：一次数据库或上游抖动就把一个本来健康的容器判成
    # unhealthy 并重启——重启解决不了依赖不可用，只是让服务在依赖恢复期间
    # 也没了。就绪供发布闸门与编排用，不给探针用。
    # /actuator/health 不行：Spring Boot 默认把 DataSource 的健康指示器算进去，
    # 于是它实际是个就绪端点。/api/health 是零依赖的那一个。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    # worker 与 api 是**同一个镜像**、不同的启动形态（SPRING_MAIN_WEB_APPLICATION_TYPE=none）。
    # 两者共用一个 tag 是有意的：分开会让「api 与 worker 跑着不同代码」成为可能，
    # 而那种错位的表现是工作流活动调用一个 api 侧已经改过签名的服务。
    container_name: tenderforge-worker
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-vxture}/tenderforge-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      ai:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:mysql://mysql:3306/czghagent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DATABASE_USERNAME: czghagent
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-ChangeMe-Mysql-2026}
      DATABASE_DRIVER: com.mysql.cj.jdbc.Driver
      # 调优项。compose 的 environment: 是白名单——不在这里列出来，
      # 写进 .env 就完全没有反应，服务照常起来、照常用默认值、没有任何报错。
      # SERVER_PORT 刻意不放开：8081 在健康检查和 nginx 上游里是写死的，
      # 放开等于给人一个能把整栈弄坏的开关。
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE:-50MB}
      UPLOAD_MAX_REQUEST_SIZE: ${UPLOAD_MAX_REQUEST_SIZE:-55MB}
      PRIVATE_STORAGE_ROOT: /app/data/private
      AI_SERVICE_BASE_URL: http://ai:8000
      AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN:-ChangeMe-Internal-Token-2026}
      AI_SERVICE_TIMEOUT_SECONDS: ${AI_SERVICE_TIMEOUT_SECONDS:-600}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-DIRECT_DEEPSEEK}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-deepseek-v4-flash}
      AI_MODEL_FAST_NAME: ${AI_MODEL_FAST_NAME:-deepseek-v4-flash}
      AI_MODEL_QUALITY_NAME: ${AI_MODEL_QUALITY_NAME:-deepseek-v4-pro}
      BID_CHARACTERS_PER_PAGE: ${BID_CHARACTERS_PER_PAGE:-700}
      BID_GENERATION_MAX_CONCURRENCY: ${BID_GENERATION_MAX_CONCURRENCY:-3}
      TEMPORAL_ENABLED: "true"
      TEMPORAL_WORKER_ENABLED: "true"
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      DOCUMENT_SERVICE_ENABLED: ${DOCUMENT_SERVICE_ENABLED:-true}
      DOCUMENT_SERVICE_BASE_URL: ${DOCUMENT_SERVICE_BASE_URL:-http://ai:8000}
      DOCUMENT_SERVICE_TIMEOUT_SECONDS: ${DOCUMENT_SERVICE_TIMEOUT_SECONDS:-1800}
      BOOTSTRAP_ENABLED: "false"
      # ── 平台接入（产品接入通则）────────────────────────────────────────
      # 这些变量必须在这里显式列出：compose 的 environment 是白名单，
      # 宿主机 shell 或 .env 里有而这里没列的，容器根本看不到。
      # 漏列的表现不是报错——是「把凭证写进 .env 之后什么都没发生」。
      DEPLOY_STAGE: ${DEPLOY_STAGE:?必须显式设置（local/dev/beta/production）——缺省成 local 会静默放行替身}
      ALLOW_MOCK_ON_DEPLOY: ${ALLOW_MOCK_ON_DEPLOY:-false}
      # C1 身份 / C1b 换票：这一对 client 凭据同时是 S2S 凭据
      OIDC_RP_ENABLED: ${OIDC_RP_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      RP_SESSION_TTL: ${RP_SESSION_TTL:-43200}
      # 生产必须为 true：__Host- 前缀的 cookie 在 http 上会被浏览器直接拒收
      RP_SESSION_SECURE_COOKIE: ${RP_SESSION_SECURE_COOKIE:-false}
      # C2 权益 / C3 用量与开通
      PLATFORM_API_URL: ${PLATFORM_API_URL:-}
      PLATFORM_INTERNAL_AUTH_TOKEN: ${PLATFORM_INTERNAL_AUTH_TOKEN:-}
      TENDERFORGE_PROVISION_WEBHOOK_SECRET: ${TENDERFORGE_PROVISION_WEBHOOK_SECRET:-}
      TENDERFORGE_PROVISION_WEBHOOK_SECRET_NEXT: ${TENDERFORGE_PROVISION_WEBHOOK_SECRET_NEXT:-}
      CONSOLE_BASE_URL: ${CONSOLE_BASE_URL:-https://console.vxture.com}
      # Atlas 模型出口
      ATLAS_API_URL: ${ATLAS_API_URL:-}
      # 仅本地：驱动权益替身走遍各档位分支（部署态替身根本起不来）
      MOCK_TIER: ${MOCK_TIER:-}
      MOCK_STATUS: ${MOCK_STATUS:-}
      MOCK_BUNDLED: ${MOCK_BUNDLED:-false}
      MOCK_USAGE_GATED: ${MOCK_USAGE_GATED:-false}
      USAGE_FLUSH_INTERVAL_MS: ${USAGE_FLUSH_INTERVAL_MS:-15000}
      USAGE_FLUSH_BATCH_SIZE: ${USAGE_FLUSH_BATCH_SIZE:-100}
    volumes:
      - private-files:/app/data/private

  web:
    container_name: tenderforge-web
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-vxture}/tenderforge-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/project-name-web/Dockerfile
      secrets:
        - github_packages_token
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 端口登记表 2026-09-10 分配 4050/4051（L3 #5）。R3：这个回退默认值、
      # 登记表、生产容器内口必须是同一个数——5274 是此前自取的未登记值。
      - "${APP_PUBLISH_HOST:-127.0.0.1}:${APP_PUBLISH_PORT:-4050}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  private-files:

secrets:
  github_packages_token:
    environment: GITHUB_PACKAGES_TOKEN

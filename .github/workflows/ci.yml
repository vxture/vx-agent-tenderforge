name: ci

# 主干 CI：在指向 main 的 PR 与 main 上的推送触发。**不部署**。
#
# 产出分支保护要求的五个检查里的四个：`quality-gate` / `build` /
# `test-coverage` / `audit`（第五个 `gitleaks` 在 secret-scan.yml）。
# 作业名是稳定契约——改名会直接让分支保护失效，而失效的表现是
# 「保护还在页面上，但没有任何检查被要求」。
#
# 与基准产品 vxtpl 的形态差异（见 docs/50-deployment/10-deployment-plan.md §2）：本产品是
# Java + Python + 前端三套，三个镜像；所以 build 与 test-coverage 都是
# 三段并行的矩阵，而不是单个 pnpm 命令。

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.ref_name) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 依赖漏洞（SCA 硬闸门）────────────────────────────────────────────────
  # 直接跑固定版本、校验过 sha256 的二进制，不用第三方 action：组织仓库上
  # 官方 action 需要授权，而二进制不需要，同时也避开一层供应链。
  #
  # 本产品有<b>三个生态</b>：npm（前端）、Maven（后端）、PyPI（AI 服务）。
  # 只扫一个的表现是另外两个的漏洞永远不出现，而报告是绿的。
  #
  # Java 那一半要先用 Maven 自己把依赖树解析出来（见下面那一步的说明），
  # 断言逻辑全在 scripts/ci/sca-scan.sh——那个文件能在本地逐字复跑。
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 单一升级点（见 https://github.com/google/osv-scanner/releases）。
      # 版本号与下面的 sha256 必须一起改。
      OSV_SCANNER_VERSION: "2.4.0"
      # 生成 CycloneDX 聚合 SBOM 的插件。钉死版本：构建期插件同样是供应链。
      CYCLONEDX_PLUGIN_VERSION: "2.9.1"
      # uv 解析出来的那份 requirements.txt 就是扫描器要扫的东西。不钉版本意味着
      # 「今天扫的依赖树」与「昨天扫的依赖树」可能由两个不同的解析器算出来，
      # 而这个差异不会体现在任何一份报告里。
      UV_VERSION: "0.12.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # osv-scanner 自带的 pom.xml 传递解析在这里是<b>不能用</b>的：它自己去
      # repo.maven.apache.org 拉父 POM，实测被 <b>HTTP 429</b> 拒绝，而失败的
      # 表现极坏——「Scanned pom.xml 并找到 6 个包」照常打印，紧接着一行
      # failed resolution，于是只有各模块直接声明的依赖被扫，Spring Boot
      # 拉进来的整棵传递树一个都没扫到，报告却是绿的。
      #
      # 所以让 <b>Maven 自己</b>解析：cyclonedx 聚合 SBOM 就是真正打进产物的
      # 那棵树，不是一个近似。实测 25 个直接声明 → 112 个包。
      # 走 setup-java 缓存的 ~/.m2，热缓存下这一步 10 秒以内。
      - name: Resolve the Java dependency tree (CycloneDX aggregate SBOM)
        working-directory: backend/project-name-java
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp \
            "org.cyclonedx:cyclonedx-maven-plugin:${CYCLONEDX_PLUGIN_VERSION}:makeAggregateBom" \
            -DoutputFormat=json \
            -DoutputName=bom \
            -Dmaven.test.skip=true
          # 名字是有意义的：osv-scanner 靠文件名挑提取器，叫别的会得到
          # 「could not determine extractor suitable to this file」而<b>静默跳过</b>。
          test -f target/bom.json

      # osv-scanner 确实会解析 requirements.txt 的传递依赖，但**解析出来的版本
      # 是错的**：实测它认定 idna 3.9.0、pygments 2.9.0，而真正装进镜像的是
      # idna 3.19、pygments 2.21.0。多报的 22 条全是不存在的问题，按它说的去
      # 「修」还是无效动作——版本本来就比它以为的新。一个会喊狼来了的闸门
      # 等于没有闸门。
      # uv 解析出的是真正会被装上的那套（15 → 42 个包），不装、不编译，几秒。
      #
      # 文件名必须是 requirements.txt：osv-scanner 靠文件名挑提取器。
      - name: Resolve the Python dependency tree (uv pip compile)
        working-directory: backend/project-name-python
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check "uv==${UV_VERSION}"
          mkdir -p target
          # --python-version 固定住 marker 求值，让扫描结果与镜像里装的那套一致
          # （Dockerfile 是 python:3.12-slim）。
          python -m uv pip compile requirements.txt \
            --python-version 3.12 \
            --output-file target/requirements.txt \
            --quiet

      - name: Cache osv-scanner binary
        id: osv-cache
        uses: actions/cache@v6
        with:
          path: /tmp/osv-bin
          key: osv-scanner-${{ env.OSV_SCANNER_VERSION }}-linux-amd64

      - name: Download osv-scanner (cache miss only)
        if: ${{ steps.osv-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sha256=15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
          url="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          mkdir -p /tmp/osv-bin
          # --proto/--proto-redir：-L 会跟随重定向，不加这两个的话一次跳到
          # http:// 的重定向会被静默跟随。sha256 能挡住被换掉的产物，
          # 这两个参数挡的是明文那一跳。
          curl -fsSL --proto "=https" --proto-redir "=https" --tlsv1.2 "$url" -o /tmp/osv-bin/osv-scanner
          echo "${sha256}  /tmp/osv-bin/osv-scanner" | sha256sum -c -

      - name: Scan every ecosystem (npm + Maven + PyPI)
        shell: bash
        env:
          OSV_SCANNER: /tmp/osv-bin/osv-scanner
        run: |
          set -euo pipefail
          chmod +x /tmp/osv-bin/osv-scanner
          bash scripts/ci/sca-scan.sh

      - name: Upload SCA reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sca-reports
          path: |
            /tmp/osv-inventory.txt
            /tmp/osv-npm.txt
            /tmp/osv-java.txt
            /tmp/osv-python.txt
            backend/project-name-java/target/bom.json
            backend/project-name-python/target/requirements.txt
          if-no-files-found: ignore

  # ── 静态守卫（汇入 quality-gate）────────────────────────────────────────
  static-checks:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Whitespace and conflict-marker check
        run: git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # compose 的 environment: 是白名单：不在其中的变量写进 .env 完全没有
      # 反应。这条守卫是本仓真实出过的事故的直接产物——.env.example 曾经
      # 一口气落后 36 个键，而那份模板正是 ENV_FILE_BASE64 的起点。
      - name: Env template guardrail (.env.example <-> compose <-> application.yml)
        run: python scripts/guardrails/check_env_example.py

      # main-ruleset.json 是被逐字应用到仓库上的；这里放松一格，
      # 保护就整体弱一格，而没有任何地方会提示。
      - name: Ruleset guardrail (no bypass, five checks still required)
        run: python scripts/guardrails/check_ruleset.py

      # ruff 一直在 pyproject 里配着，却从没进过 CI——于是它慢慢积了 6 条：
      # 一个真正没用的 import、两处 import 顺序、一处该用 datetime.UTC。
      # 配了不跑的 linter 等于没配，而且比没配更坏：它让人以为查过了。
      # 列锁白名单与代码里真实的 UPDATE 必须逐列一致。两个方向都要红：
      # 少给 → 生产 permission denied，而本地以 owner 连库完全不显形；
      # 多给 → 没有任何报错，只是一次注入的爆炸半径从几列变回整表。
      - name: Column lock guardrail (whitelist <-> real UPDATE statements)
        run: python scripts/guardrails/check_column_locks.py

      # 闸门（ci 的 audit）与巡检器（sca-watch）必须扫同一个东西。巡检器用更旧的
      # 扫描器会在闸门要拦的发现上报「干净」——假绿色比没有巡检更坏，因为它让人
      # 停止怀疑。同时断言两者都不产生那五个必需检查上下文。
      - name: SCA lockstep guardrail (gate <-> idle-trunk watcher)
        run: python scripts/guardrails/check_sca_lockstep.py

      - name: Python lint (ruff)
        working-directory: backend/project-name-python
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check ruff==0.11.13
          python -m ruff check czghagent_ai tests

      # 本仓的 shell 脚本要挂进容器执行、要在部署主机上跑，出错的代价比
      # 一般脚本高。shellcheck 第一次跑就在 sca-scan.sh 里挑出两处
      # ${var#$pattern} 的未加引号展开——那类问题在正常路径上完全不显形。
      #
      # 版本必须钉死。第一版用 `apt-get install shellcheck`，结果本地
      # （koalaman/shellcheck:stable 容器）干净、CI 红——runner 镜像里那个
      # 版本多报一条 SC2015。**本地与 CI 跑的不是同一个 linter**，那比不跑
      # 更消耗人：每次都要推一遍才知道结果。钉版本 + 校验 sha256，与
      # osv-scanner、gitleaks 同一套做法。
      - name: Shell lint (shellcheck)
        shell: bash
        env:
          SHELLCHECK_VERSION: "0.10.0"
        run: |
          set -euo pipefail
          sha256=6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --proto "=https" --proto-redir "=https" --tlsv1.2 "$url" -o /tmp/shellcheck.tar.xz
          echo "${sha256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          /tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck --version
          /tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck deploy/deploy.sh scripts/ci/sca-scan.sh

  # ── 质量闸门（聚合器；稳定的必需检查名）─────────────────────────────────
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    needs: [static-checks]
    steps:
      - name: Aggregate
        run: echo "quality gate - 所有聚合检查通过"

  # ── 构建（必需检查）：三个镜像各自能构建出来 ────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 刻意<b>不用</b> docker/setup-buildx-action：治理规范 §9 说「能不取就不取，
      # 必须取就 SHA-pin」。runner 自带的 docker 打开 DOCKER_BUILDKIT 就支持
      # --secret，少取一个第三方 action 就少一条供应链。
      #
      # 前端要从 GitHub Packages 取 @vxture/*，走 BuildKit secret 而不是
      # ARG：ARG 会留在镜像层历史里，任何能 pull 到镜像的人都读得到。
      - name: Write the packages token for BuildKit
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo "!! 缺少组织级 NODE_AUTH_TOKEN" >&2; exit 1; }
          umask 077
          printf '%s' "$NODE_AUTH_TOKEN" > /tmp/github_packages_token

      # 三个镜像分别构建。这里只验「能构建」，推送在 build.yml 里做。
      - name: Build api image (Java)
        run: docker build -f backend/project-name-java/Dockerfile -t tenderforge-api:ci .

      - name: Build ai image (Python)
        run: docker build -f backend/project-name-python/Dockerfile -t tenderforge-ai:ci .

      - name: Build web image (frontend)
        run: |
          docker build -f frontend/project-name-web/Dockerfile \
            --secret id=github_packages_token,src=/tmp/github_packages_token \
            -t tenderforge-web:ci .

      - name: Shred the token
        if: always()
        run: rm -f /tmp/github_packages_token

  # ── 测试与覆盖率（必需检查）：三套并行 ──────────────────────────────────
  test-coverage:
    name: test-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      # 后端：六个 Maven 模块 + 覆盖率聚合。
      #
      # 集成测试用 Testcontainers 起**真 Postgres**，跑 deploy/database/ddl 里
      # 那份基线，并以受限角色 tenderforge_svc 连接（见 PostgresBackedTest）。
      # ubuntu-latest 自带 docker，不需要额外 service 容器。
      #
      # TZ 与 compose 里给 api/worker 的一致：时间列是 TIMESTAMPTZ，读写用同一个
      # 会话时区往返才精确。runner 默认 UTC，不钉住的话本地过、CI 过，但两边
      # 验的不是同一件事。
      - name: Java tests and coverage
        working-directory: backend/project-name-java
        env:
          TZ: Asia/Shanghai
        run: mvn -B -Pcoverage-report verify -DskipITs

      - name: Python tests
        working-directory: backend/project-name-python
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check -r requirements.txt
          python -m pytest -q

      - name: Frontend tests
        working-directory: frontend/project-name-web
        env:
          # @vxture/* 从 GitHub Packages 解析（组织级 secret，visibility=all）。
          # 缺它时 pnpm 会拿到 401，node_modules 装成半成品，
          # 而失败信息是「找不到 tsc」——离真正的原因很远。
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          pnpm config set "//npm.pkg.github.com/:_authToken" "$NODE_AUTH_TOKEN"
          pnpm install --frozen-lockfile
          pnpm test

      # 覆盖率是趋势指标，不是闸门——本轮的经验是「覆盖率涨了不等于验过了」，
      # 卡一个百分比只会鼓励写出能覆盖但不成立的测试。这里只报告。
      - name: Report Java coverage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report=backend/project-name-java/project-name-coverage/target/site/jacoco-aggregate/jacoco.xml
          test -f "$report" || { echo "（没有生成聚合覆盖率报告）"; exit 0; }
          python - "$report" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          counters = {c.get('type'): (int(c.get('missed')), int(c.get('covered')))
                      for c in root.findall('counter')}
          for name in ('INSTRUCTION', 'BRANCH'):
              missed, covered = counters[name]
              print(f"{name}: {100 * covered / (missed + covered):.1f}%")
          PY

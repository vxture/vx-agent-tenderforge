name: deploy

# tag 触发的生产部署。`v*.*.*` → 构建三个镜像 → 在 worker-02 上起栈。
#
# 部署机 vx-worker-02 在 tailnet 内、无公网（治理规范 §5 domestic profile），
# 所以要先 join tailnet 再 SSH。`production` 这个 GitHub Environment 带
# **Required reviewers**，deploy 作业会停在审批门上等人点同意——
# 零保护的表现是 tag 一推就直接上线，没有任何人看过（varda 首上线教训）。
#
# **这条链不碰数据库结构**（治理规范 §11）。DDL 单一权威在
# deploy/database/ddl/，只由 db-init.yml 施加（confirm=yes + expected_sha +
# 生产环境审批门）。应用以最小权限角色连库，连 CREATE 的权限都没有——
# 就算有人把 flyway 加回来，建表也会被库直接拒绝。两道闸门刻意重叠：
# 配置可以被改错，权限不会。

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      explicit_environment:
        description: "调试用的环境覆盖（目前只有 production）"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - production

# 按目标环境串行，**不按 tag**。在飞的部署不取消——中途掐断一次
# `compose up -d` 会留下一个半新半旧的栈，而那种状态没有任何地方会报告。
concurrency:
  group: deploy-production
  cancel-in-progress: false

# 权限按作业给。detect 只做一次字符串路由，deploy 只需要读——
# 在 workflow 层开 packages: write 会把它连带给到每一个作业，
# 包括那些只是算个变量的。
permissions:
  contents: read

env:
  PRODUCT_CODE: tenderforge

jobs:
  detect:
    name: detect-target-environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.route.outputs.environment }}
    steps:
      - name: Route tag to GitHub Environment
        id: route
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # **分支顺序是有载荷的，不是风格。** glob 里 `v*.*.*` 同样匹配
          # `v0.1.0-beta.1`——把生产那条放在前面，一个 beta tag 会被静默路由到
          # 生产环境，取到生产的 secret、部署到生产目录，而日志里一切正常。
          # 所以预发布形态必须先被吃掉。
          #
          # 第二条 `v*.*.*-*` 是拒绝而不是兜底：`-rc.1` / `-alpha` 这类形态没有
          # 对应环境，让它落到生产是同一个事故的另一种写法。宁可在这里红。
          case "$TAG" in
            v*.*.*-beta.*) environment=beta ;;
            v*.*.*-*)
              echo "::error::未知的预发布形态：$TAG。beta 用 vX.Y.Z-beta.N，生产用 vX.Y.Z" >&2
              exit 1 ;;
            v*.*.*) environment=production ;;
            *) echo "::error::deploy.yml 被一个不支持的 tag 触发：$TAG" >&2; exit 1 ;;
          esac
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "路由：tag=$TAG -> environment=$environment"

  call-build:
    name: docker-build
    uses: ./.github/workflows/build.yml
    needs: detect
    permissions:
      contents: read
      packages: write
    with:
      pass_sha: ${{ github.sha }}
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
      ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [detect, call-build]
    permissions:
      contents: read
      packages: read
      issues: write
    environment:
      name: ${{ needs.detect.outputs.environment }}
    steps:
      - name: Checkout deploy sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Validate deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
          ALIYUN_ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_NAMESPACE: ${{ vars.ALIYUN_ACR_NAMESPACE }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # 一次报全，不要第一个缺的就退出——运维配环境时最不想要的
          # 就是「改一个、跑一次、再发现下一个缺」。
          missing=()
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS \
                     ENV_FILE_BASE64 ALIYUN_ACR_REGISTRY ALIYUN_ACR_NAMESPACE \
                     TAILSCALE_OAUTH_CLIENT_ID TAILSCALE_OAUTH_CLIENT_SECRET; do
            [ -n "${!key:-}" ] || missing+=("$key")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::环境缺少这些配置：${missing[*]}" >&2
            echo "DEPLOY_* 与 ENV_FILE_BASE64 是**环境级** secret，不从别的仓继承，" >&2
            echo "必须在本仓的 production 环境里重建（治理规范 §6）。" >&2
            exit 1
          fi

      - name: Join tailnet and prepare SSH
        uses: ./.github/actions/tailnet-ssh-connect
        with:
          tailscale-oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tailscale-tag: ${{ vars.TAILSCALE_OAUTH_CLIENT_TAG }}
          deploy-host: ${{ secrets.DEPLOY_HOST }}
          deploy-port: ${{ secrets.DEPLOY_PORT }}
          deploy-ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          deploy-ssh-passphrase: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
          deploy-known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Bootstrap .env on target host
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          # **变量不是 secret**：文件路径不是凭据，而把它做成 secret 的代价是
          # 日志里全是 ***，出事时所有诊断信息一起被抹掉——这一条是 2026-09-10
          # 那次排查花掉一整轮才换来的。
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          ENV_FILE_B64: ${{ secrets.ENV_FILE_BASE64 }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          # DEPLOY_DIR 必须精确到**含 compose + .env 的那一层**（治理规范 §6）。
          # 差一级的表现是镜像能拉、compose 找不到 env_file 而失败（varda 教训）。
          deploy_dir="${DEPLOY_DIR:-/srv/md0/${PRODUCT_CODE}}"
          # 任何远端命令之前先把话说死。错值在 Linux 上是合法的相对路径，
          # 每一步都会一致地成功，直到某处偶然把它再解析一次——见脚本头注释。
          bash scripts/ci/assert-deploy-dir.sh "$deploy_dir"
          ssh_opts=(-i ~/.ssh/deploy_key -p "$port" -o ServerAliveInterval=30 \
                    -o ServerAliveCountMax=20 -o ConnectTimeout=30)
          # .env 只在**首次**投递。之后运维在主机上改的值是权威——
          # 每次部署都覆盖它，等于每次发布都悄悄回滚一次运维的调整。
          if ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "test -f '$deploy_dir/.env'"; then
            echo "[bootstrap] $deploy_dir/.env 已存在，跳过"
          else
            ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$deploy_dir'"
            printf '%s' "$ENV_FILE_B64" | ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "base64 -d > '$deploy_dir/.env' && chmod 600 '$deploy_dir/.env'"
            echo "[bootstrap] .env 已创建"
          fi

      - name: Deploy over SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          # **变量不是 secret**：文件路径不是凭据，而把它做成 secret 的代价是
          # 日志里全是 ***，出事时所有诊断信息一起被抹掉——这一条是 2026-09-10
          # 那次排查花掉一整轮才换来的。
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          PASSED_SHA: ${{ github.sha }}
          IMAGE_TAG: ${{ needs.call-build.outputs.image_tag }}
          ALIYUN_ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_NAMESPACE: ${{ vars.ALIYUN_ACR_NAMESPACE }}
          ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          # DEPLOY_DIR 必须精确到**含 compose + .env 的那一层**（治理规范 §6）。
          # 差一级的表现是镜像能拉、compose 找不到 env_file 而失败（varda 教训）。
          deploy_dir="${DEPLOY_DIR:-/srv/md0/${PRODUCT_CODE}}"
          # 任何远端命令之前先把话说死。错值在 Linux 上是合法的相对路径，
          # 每一步都会一致地成功，直到某处偶然把它再解析一次——见脚本头注释。
          bash scripts/ci/assert-deploy-dir.sh "$deploy_dir"
          image_tag="$IMAGE_TAG"
          test -n "$image_tag"
          ssh_opts=(-i ~/.ssh/deploy_key -p "$port" -o ServerAliveInterval=30 \
                    -o ServerAliveCountMax=20 -o ConnectTimeout=30)

          # 只投递部署需要的那几样，一次 staged rsync --delete。
          # 运维的 .env 就在 $deploy_dir 下，所以 --delete 要**排除**它——
          # 否则每次部署都会把它删掉，然后 bootstrap 那步看到文件不存在又
          # 重新投递一份 CI 里的版本，运维改过的值就此消失，且无声无息。
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$deploy_dir'"
          # 投递保持**仓内的相对结构**：compose 在顶层、deploy/ 是它的子目录。
          # 压平成一层会让 compose 里的 ./deploy/postgres/init-temporal.sh 失效，
          # 而失效的表现是 temporal-db-init 挂到一个空路径、静默什么都不做。
          stage="$(mktemp -d)"
          cp -a deploy "$stage/deploy"
          cp -a docker-compose.yml "$stage/docker-compose.yml"
          # --delete 会清掉目标目录里不在源里的东西，所以三样必须排除：
          # 运维的 .env（删了会被下次 bootstrap 用 CI 版本覆盖，运维改过的
          # 值无声消失）、VERSION（溯源）、data（容器写的 root 所有的持久
          # 数据，碰它下次 rsync 会以权限错误失败）。
          rsync -az --delete --exclude='.env' --exclude='VERSION' --exclude='data' \
            -e "ssh -i ~/.ssh/deploy_key -p $port -o ConnectTimeout=30" \
            "$stage/" "$DEPLOY_USER@$DEPLOY_HOST:$deploy_dir/"
          rm -rf "$stage"

          # 交付校验：投过去的 compose 必须是本产品的。一个被截断或者投错
          # 产品的 compose 绝不能走到 up -d——那会在别人的栈上起容器。
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "grep -q 'container_name: ${PRODUCT_CODE}-api' '$deploy_dir/docker-compose.yml'" || {
              echo "::error::投过去的 compose 里没有 ${PRODUCT_CODE}-api，拒绝继续" >&2
              exit 1
            }
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "printf '%s\n' '$PASSED_SHA' > '$deploy_dir/VERSION'"

          cat > /tmp/remote-deploy.sh <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$REPO_DIR"
          # **主源是 ACR，不是 GHCR。** 部署机在国内，而 v0.1.1 那次从 GHCR 拉三个
          # 镜像用掉 44 分钟（api 12m53s / ai 30m52s，约 800KB/s），compose 起栈和
          # 健康检查加起来才几十秒——整次部署的时间几乎全在这里。ACR 在 cn-beijing，
          # 是同一批镜像的另一个副本，构建那一步已经同时推了两处。
          #
          # GHCR 退为备源：ACR 出问题时仍然能发车，只是慢。顺序反过来的代价不是
          # 「慢一点」，是让每次发布都要占住一个部署窗口。
          #
          # 组织里还有一个 ALIYUN_ACR_INTERNAL_HOST（VPC 内网端点），只有部署机在
          # 同一个 VPC 里才通，且要对它单独 docker login。worker02 是否在那个 VPC
          # 里没有核实过，所以这里**不用**它——猜错的表现是登录超时后退回 GHCR，
          # 又变回 44 分钟。核实之后再启用，那是另一次改动。
          export IMAGE_REGISTRY="$ALIYUN_ACR_REGISTRY"
          export IMAGE_NAMESPACE="$ALIYUN_ACR_NAMESPACE"
          export IMAGE_TAG="$IMAGE_TAG"
          export FALLBACK_IMAGE_REGISTRY="ghcr.io"
          export FALLBACK_IMAGE_NAMESPACE="vxture"
          if [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          fi
          if [ -n "${ALIYUN_ACR_USERNAME:-}" ] && [ -n "${ALIYUN_ACR_PASSWORD:-}" ]; then
            for attempt in 1 2 3 4 5; do
              printf '%s' "$ALIYUN_ACR_PASSWORD" \
                | timeout 45 docker login "$ALIYUN_ACR_REGISTRY" -u "$ALIYUN_ACR_USERNAME" --password-stdin \
                && break || sleep $((attempt * 5))
            done
          fi
          bash deploy/deploy.sh all
          REMOTE_SCRIPT
          scp -i ~/.ssh/deploy_key -P "$port" -o ConnectTimeout=30 \
            /tmp/remote-deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/remote-deploy.sh"

          remote_env=(
            "PRODUCT_CODE=$PRODUCT_CODE" "REPO_DIR=$deploy_dir" "IMAGE_TAG=$image_tag"
            "ALIYUN_ACR_REGISTRY=$ALIYUN_ACR_REGISTRY" "ALIYUN_ACR_NAMESPACE=$ALIYUN_ACR_NAMESPACE"
            "ALIYUN_ACR_USERNAME=$ALIYUN_ACR_USERNAME" "ALIYUN_ACR_PASSWORD=$ALIYUN_ACR_PASSWORD"
            "GHCR_USERNAME=$GHCR_USERNAME" "GHCR_TOKEN=$GHCR_TOKEN"
          )
          remote_cmd=""
          for item in "${remote_env[@]}"; do
            key="${item%%=*}"; value="${item#*=}"
            printf -v escaped '%q=%q ' "$key" "$value"
            remote_cmd+="$escaped"
          done
          remote_cmd+="bash /tmp/remote-deploy.sh"
          # 从 stdin 喂过去，不走 argv——argv 会出现在目标主机的 ps/proc 里，
          # 而里面带着 ACR 密码和 GHCR 令牌。
          printf '%s\n' "$remote_cmd" | ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s

      - name: Notify on deploy failure (open/update issue)
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const env = '${{ needs.detect.outputs.environment }}';
            const title = `Deploy failure: ${env}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const tag = context.ref.replace('refs/tags/', '');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'deploy-failure' });
            const existing = issues.find((i) => i.title === title);
            const body = `部署到 **${env}** 失败，提交 \`${context.sha.substring(0, 7)}\`（tag \`${tag}\`）。\n\n运行记录：${runUrl}`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['deploy-failure'] });
            }

      - name: Close deploy-failure issue on success
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const env = '${{ needs.detect.outputs.environment }}';
            const title = `Deploy failure: ${env}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'deploy-failure' });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: 'closed' });
            }

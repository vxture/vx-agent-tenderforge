name: secret-scan

# 密钥卫生的 CI 闸门。全历史扫描，任何命中都让作业失败并挡住合并
# （`gitleaks` 是 main 上的必需检查）。
#
# 直接跑固定版本的二进制而不是官方 action：后者在组织仓库上需要授权，
# 二进制不需要。下载做 sha256 校验。规则与已知安全占位符的白名单在
# 仓根的 .gitleaks.toml。
#
# 本仓有一条具体的历史教训：GitHub Packages 令牌一度以明文出现在会话里。
# 它只活在 .env（已 gitignore）与镜像构建时的 BuildKit secret 里，
# 从没进过版本库——而这条闸门是确保「从没进过」这句话为真的那个机制。

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  # 单一升级点（见 https://github.com/gitleaks/gitleaks/releases）。
  # 版本号与下面的 sha256 必须一起改。
  GITLEAKS_VERSION: "8.21.2"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          # `gitleaks detect` 扫的是全部提交历史，所以泄漏检查覆盖过去的提交
          # 而不只是工作树。一个曾经提交过、后来删掉的密钥仍然在历史里。
          fetch-depth: 0

      - name: Cache gitleaks binary
        id: gitleaks-cache
        uses: actions/cache@v6
        with:
          path: /tmp/gitleaks-bin
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-linux-x64

      - name: Download gitleaks (cache miss only)
        if: ${{ steps.gitleaks-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sha256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p /tmp/gitleaks-bin
          curl -fsSL --proto "=https" --proto-redir "=https" --tlsv1.2 "$url" -o /tmp/gitleaks.tar.gz
          echo "${sha256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks

      - name: Scan full git history (gitleaks detect)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x /tmp/gitleaks-bin/gitleaks
          # --redact 让命中的值不进日志；命中即非零退出，挡住这个必需检查。
          /tmp/gitleaks-bin/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload findings (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
